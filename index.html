      homesLow: (n, g, a) => `${n} homes use on average ${g} m³ of gas a year, below the Almelo average of ${a} m³; heating is still the main use of gas here.`,
      homesAvg: (n) => `CBS publishes no gas figure for these ${n} homes, so the Almelo average was used.`,
      gasPct: (p) => `${p}% of homes here are heated with natural gas.`,
      traffic: (v, r) => `The traffic figure (${v} t) comes from the national road traffic model on a 1 km grid.` + (r != null ? ` The nearest main-road on-ramp is on average ${r} km away.` : ''),
      industry: (v, n) => `${v} t from industry, placed using the registry’s 1 km map and the ${n} industrial and energy firms registered in this neighbourhood.`,
      services: (v, n) => `${v} t from shops, offices and public buildings (${n} business establishments), mostly gas for heating.`,
      waste: (v) => `${v} t from waste or sewage treatment: the registry places a treatment or waste site in or next to this neighbourhood.`,
      few: 'Few people live here; the emissions come from activity, not housing.'
    },
    methodsTitle: 'How the numbers were made',
    methods: [
      'Neighbourhood borders, homes and average gas use per home: CBS Wijk- en Buurtkaart 2024 (v2). Homes CO₂ = homes × average gas (m³) × 1.78 kg CO₂/m³. Measured data.',
      'All other sources: Emissieregistratie, CO₂ to air, 2024, 1 km grid (“Combinatie kaart vk5 NCP en vk1 Nederland”). Each 1 km cell was split over the neighbourhoods it overlaps: by area for traffic and agriculture, by the number of firms for industry and services. Waste and sewage cells were kept whole inside Almelo.',
      'Each registry source was then scaled so that all neighbourhoods add up to the registry’s Almelo total. The largest corrections: traffic ×1.11, industry ×1.06; others within ±1%.',
      'Direct emissions only (source approach): CO₂ from power plants for electricity used in Almelo is not included. Homes’ electricity is shown separately as a note.',
      'Totals: homes 54.6 kt (CBS gas, not weather-corrected; Emissieregistratie gives 61.8 kt for households), traffic 119.5 kt, industry 29.4 kt, services 21.3 kt, waste and sewage 10.9 kt, agriculture 1.7 kt.'
    ],
    limits: 'Homes are measured per neighbourhood. Traffic, industry and services are model results from the registry, split over neighbourhoods; read them as good estimates, not measurements.',
    srcTitle: 'Sources'
  },
  fa: {
    title: 'کربن آلمیلو به تفکیک محله',
    sub: 'انتشار مستقیم کربن هر محله در سال ۲۰۲۴: چقدر، از چه منبعی و چرا. روی یک محله در نقشه کلیک کن یا از لیست انتخابش کن.',
    pick: 'محله', all: 'همه‌ی محله‌ها',
    modes: { main: 'منبع اصلی', total: 'کل کربن', ha: 'کربن در هر هکتار' },
    src: { homes: 'خانه‌ها (گاز)', traffic: 'ترافیک', industry: 'صنعت', services: 'مغازه، دفتر، عمومی', waste: 'پسماند و فاضلاب', agri: 'کشاورزی', other: 'سایر (پسماند و فاضلاب)' },
    t: 'تن', tyr: 'تن کربن در سال', tha: 'تن در هکتار', total: 'کربن مستقیم', share: 'از کل آلمیلو', mainsrc: 'منبع اصلی',
    cols: { src: 'منبع', val: 'تن کربن', pct: 'سهم', basis: 'نوع داده' },
    measured: 'اندازه‌گیری', avgest: 'تخمینی', model: 'مدل',
    why: 'چرا', facts: 'درباره‌ی این محله',
    homes: 'خانه‌ها', pop: 'ساکنان', gas: 'میانگین گاز هر خانه', gasPct: 'خانه‌های گازی', biz: 'کسب‌وکارها', ind: 'شرکت‌های صنعت و انرژی', land: 'مساحت خشکی', ramp: 'فاصله تا ورودی جاده‌ی اصلی',
    elecNote: (v) => `برق مصرفی خانه‌ها حدود ${v} تن کربن دیگر در نیروگاه تولید می‌کند. این عدد در جمع بالا نیست.`,
    tableCols: ['محله', 'کربن مستقیم (تن)', 'منبع اصلی', 'خانه‌ها', 'ترافیک', 'صنعت', 'خدمات', 'پسماند'],
    r: {
      main: (s, v, p) => `بزرگ‌ترین منبع این محله ${s} است: ${v} تن، یعنی ${p} کربن مستقیم محله.`,
      homesHigh: (n, g, a) => `${n} خانه به‌طور میانگین سالی ${g} متر مکعب گاز مصرف می‌کنند، بیشتر از میانگین آلمیلو (${a} متر مکعب)، پس گرمایش عامل اصلی است.`,
      homesLow: (n, g, a) => `${n} خانه به‌طور میانگین سالی ${g} متر مکعب گاز مصرف می‌کنند، کمتر از میانگین آلمیلو (${a} متر مکعب)؛ با این حال گرمایش همچنان مصرف اصلی گاز است.`,
      homesAvg: (n) => `اداره‌ی آمار برای این ${n} خانه عدد گاز منتشر نکرده، پس از میانگین آلمیلو استفاده شد.`,
      gasPct: (p) => `${p} درصد خانه‌های این محله با گاز گرم می‌شوند.`,
      traffic: (v, r) => `عدد ترافیک (${v} تن) از مدل ملی ترافیک جاده‌ای روی شبکه‌ی یک کیلومتری می‌آید.` + (r != null ? ` نزدیک‌ترین ورودی جاده‌ی اصلی به‌طور میانگین ${r} کیلومتر فاصله دارد.` : ''),
      industry: (v, n) => `${v} تن از صنعت، که با نقشه‌ی یک کیلومتری ثبت ملی و ${n} شرکت صنعت و انرژی ثبت‌شده در این محله جای‌گذاری شده.`,
      services: (v, n) => `${v} تن از مغازه‌ها، دفترها و ساختمان‌های عمومی (${n} کسب‌وکار)، بیشتر گاز برای گرمایش.`,
      waste: (v) => `${v} تن از پسماند یا تصفیه‌ی فاضلاب: ثبت ملی یک محل پسماند یا تصفیه‌خانه را داخل یا کنار این محله نشان می‌دهد.`,
      few: 'تعداد کمی در این محله زندگی می‌کنند؛ کربن از فعالیت‌هاست، نه از خانه‌ها.'
    },
    methodsTitle: 'عددها چطور ساخته شدند',
    methods: [
      'مرز محله‌ها، تعداد خانه‌ها و میانگین گاز هر خانه: نقشه‌ی محله‌های اداره‌ی آمار هلند ۲۰۲۴ (نسخه‌ی ۲). کربن خانه‌ها = تعداد خانه × میانگین گاز (متر مکعب) × ۱٫۷۸ کیلوگرم کربن بر متر مکعب. داده‌ی اندازه‌گیری‌شده.',
      'بقیه‌ی منبع‌ها: ثبت ملی انتشار، کربن به هوا، ۲۰۲۴، شبکه‌ی یک کیلومتری. هر مربع یک کیلومتری بین محله‌هایی که با آن هم‌پوشانی دارند تقسیم شد: برای ترافیک و کشاورزی به نسبت مساحت، برای صنعت و خدمات به نسبت تعداد شرکت‌ها. مربع‌های پسماند و فاضلاب کامل داخل آلمیلو نگه داشته شدند.',
      'بعد هر منبع طوری تنظیم شد که جمع همه‌ی محله‌ها برابر کل آلمیلو در ثبت ملی شود. بزرگ‌ترین اصلاح‌ها: ترافیک ×۱٫۱۱، صنعت ×۱٫۰۶؛ بقیه کمتر از ۱ درصد.',
      'فقط انتشار مستقیم: کربن نیروگاه‌ها برای برقی که در آلمیلو مصرف می‌شود حساب نشده. برق خانه‌ها جداگانه به عنوان یادداشت آمده.',
      'جمع‌ها: خانه‌ها ۵۴٫۶ هزار تن (گاز اداره‌ی آمار، بدون اصلاح آب‌وهوا؛ ثبت ملی برای خانوارها ۶۱٫۸ می‌دهد)، ترافیک ۱۱۹٫۵، صنعت ۲۹٫۴، خدمات ۲۱٫۳، پسماند و فاضلاب ۱۰٫۹، کشاورزی ۱٫۷ هزار تن.'
    ],
    limits: 'عدد خانه‌ها برای هر محله اندازه‌گیری‌شده است. ترافیک، صنعت و خدمات نتیجه‌ی مدل ثبت ملی‌اند که بین محله‌ها تقسیم شده؛ آن‌ها را تخمین خوب بخوان، نه اندازه‌گیری.',
    srcTitle: 'منابع'
  }
};
const SOURCES = [
  ['CBS Wijk- en Buurtkaart 2024', 'https://www.cbs.nl/nl-nl/dossier/nederland-regionaal/geografische-data/wijk-en-buurtkaart-2024'],
  ['Emissieregistratie, Data export 1990–2024', 'https://www.emissieregistratie.nl/data'],
  ['Klimaatmonitor, Rapport CO₂-uitstoot Almelo', 'https://klimaatmonitor.databank.nl/Mosaic/rapport-co2-uitstoot/inleiding']
];

const F = D.features;
F.forEach(f => { f.total = SRC.reduce((a, s) => a + f.src[s], 0); f.main = SRC.reduce((m, s) => f.src[s] > f.src[m] ? s : m, 'homes'); f.perHa = f.facts.landHa ? f.total / f.facts.landHa : null; });
F.sort((a, b) => a.name.localeCompare(b.name));
const CITY = F.reduce((a, f) => a + f.total, 0);

let lang = 'en', mode = 'main', selected = F.find(f => f.name === 'Binnenstad Zuid') || F[0];
try { const s = localStorage.getItem('almelo-lang'); if (s === 'fa' || s === 'en') lang = s; } catch (e) {}
let sortKey = 'total', sortDir = -1;

const $ = id => document.getElementById(id);
const nf = (v, d = 0) => (v == null ? '–' : Number(v).toLocaleString(lang === 'fa' ? 'fa-IR' : 'en-GB', { maximumFractionDigits: d, minimumFractionDigits: d }));
const pct = v => lang === 'fa' ? nf(v * 100) + '٪' : nf(v * 100) + '%';
const colorVar = s => `var(--s-${s})`;
const mainColor = f => f.main === 'waste' || f.main === 'agri' ? 'var(--s-other)' : colorVar(f.main);

// map geometry
let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
F.forEach(f => f.rings.forEach(r => r.forEach(([x, y]) => { minx = Math.min(minx, x); maxx = Math.max(maxx, x); miny = Math.min(miny, y); maxy = Math.max(maxy, y); })));
const pad = 120, W = maxx - minx + pad * 2, H = maxy - miny + pad * 2;
const svg = $('map');
svg.setAttribute('viewBox', `0 0 ${Math.round(W)} ${Math.round(H)}`);
F.forEach(f => {
  const d = f.rings.map(r => 'M' + r.map(([x, y]) => `${Math.round(x - minx + pad)},${Math.round(maxy - y + pad)}`).join('L') + 'Z').join('');
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d); p.setAttribute('fill-rule', 'evenodd'); p.setAttribute('tabindex', '0'); p.setAttribute('role', 'button');
  p.addEventListener('click', () => select(f));
  p.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(f); } });
  p.addEventListener('mousemove', e => showTip(e, f));
  p.addEventListener('mouseleave', () => { $('tip').hidden = true; });
  f.el = p; svg.appendChild(p);
});

function quantBreaks(vals) {
  const v = vals.filter(x => x != null).sort((a, b) => a - b);
  return [1, 2, 3, 4, 5].map(i => v[Math.floor(i * v.length / 6)]);
}
function paint() {
  const key = mode === 'total' ? 'total' : 'perHa';
  const br = mode === 'main' ? null : quantBreaks(F.map(f => f[key]));
  F.forEach(f => {
    let c;
    if (mode === 'main') c = mainColor(f);
    else { const v = f[key]; if (v == null) c = 'var(--map-empty)'; else { let i = br.findIndex(b => v < b); if (i < 0) i = 5; c = `var(--q${i + 1})`; } }
    f.el.setAttribute('fill', c);
    f.el.classList.toggle('sel', f === selected);
    f.el.setAttribute('aria-label', `${f.name}: ${nf(f.total)} ${T[lang].t}`);
  });
  svg.appendChild(selected.el);
  const L = $('legend'); L.innerHTML = '';
  if (mode === 'main') {
    ['homes', 'traffic', 'industry', 'other'].forEach(s => {
      const n = F.filter(f => (s === 'other' ? (f.main === 'waste' || f.main === 'agri') : f.main === s)).length;
      L.insertAdjacentHTML('beforeend', `<span><i class="sw" style="background:${s === 'other' ? 'var(--s-other)' : colorVar(s)}"></i>${T[lang].src[s]} (${nf(n)})</span>`);
    });
  } else {
    const unit = mode === 'total' ? T[lang].t : T[lang].tha, dd = mode === 'total' ? 0 : 1;
    const edges = [0, ...br];
    edges.forEach((e, i) => {
      const lab = i < 5 ? `${nf(e, dd)}–${nf(edges[i + 1], dd)}` : `≥ ${nf(e, dd)}`;
      L.insertAdjacentHTML('beforeend', `<span><i class="sw" style="background:var(--q${i + 1})"></i>${lab} ${unit}</span>`);
    });
  }
  svg.setAttribute('aria-label', T[lang].title);
}

function showTip(e, f) {
  const tip = $('tip'), box = $('mapcard').getBoundingClientRect();
  tip.innerHTML = `<b>${f.name}</b><br>${nf(f.total)} ${T[lang].tyr}<br>${T[lang].mainsrc}: ${T[lang].src[f.main]}`;
  tip.hidden = false;
  let x = e.clientX - box.left + 14, y = e.clientY - box.top + 14;
  if (x + 240 > box.width) x = e.clientX - box.left - 250;
  tip.style.left = Math.max(4, x) + 'px'; tip.style.top = y + 'px';
}

function reasons(f) {
  const t = T[lang], r = t.r, s = f.src, out = [];
  out.push(r.main(t.src[f.main], nf(s[f.main]), pct(s[f.main] / f.total)));
  const order = SRC.filter(k => s[k] / f.total >= 0.08).sort((a, b) => s[b] - s[a]);
  order.forEach(k => {
    if (k === 'homes') {
      if (f.homesBasis === 'avg') out.push(r.homesAvg(nf(f.facts.homes)));
      else if (f.facts.gas != null) out.push((f.facts.gas >= D.avgGas ? r.homesHigh : r.homesLow)(nf(f.facts.homes), nf(f.facts.gas), nf(D.avgGas)));
      if (f.facts.gasPct != null) out.push(r.gasPct(nf(f.facts.gasPct)));
    }
    if (k === 'traffic') out.push(r.traffic(nf(s.traffic), f.facts.ramp != null ? nf(f.facts.ramp, 1) : null));
    if (k === 'industry') out.push(r.industry(nf(s.industry), nf(f.facts.ind || 0)));
    if (k === 'services') out.push(r.services(nf(s.services), nf(f.facts.biz || 0)));
    if (k === 'waste') out.push(r.waste(nf(s.waste)));
  });
  if ((f.facts.homes || 0) < 50) out.push(r.few);
  return out;
}

function renderPanel() {
  const f = selected, t = T[lang], s = f.src;
  const rows = SRC.filter(k => s[k] >= 0.5).sort((a, b) => s[b] - s[a]).map(k => {
    const basis = k === 'homes' ? (f.homesBasis === 'cbs' ? `<span class="badge m">${t.measured}</span>` : `<span class="badge e">${t.avgest}</span>`) : `<span class="badge e">${t.model}</span>`;
    return `<tr><td><span style="display:inline-flex;align-items:center;gap:7px"><i class="sw" style="background:${colorVar(k)}"></i>${t.src[k]}</span></td><td class="n">${nf(s[k])}</td><td class="n">${pct(s[k] / f.total)}</td><td>${basis}</td></tr>`;
  }).join('');
  const stack = SRC.filter(k => s[k] > 0).map(k => `<i style="width:${(s[k] / f.total * 100).toFixed(2)}%;background:${colorVar(k)}" title="${t.src[k]}"></i>`).join('');
  const fx = f.facts;
  const facts = [[t.homes, nf(fx.homes)], [t.pop, nf(fx.pop)], [t.gas, fx.gas != null ? nf(fx.gas) + ' m³' : '–'], [t.gasPct, fx.gasPct != null ? nf(fx.gasPct) + (lang === 'fa' ? '٪' : '%') : '–'], [t.biz, nf(fx.biz)], [t.ind, nf(fx.ind)], [t.land, fx.landHa != null ? nf(fx.landHa) + ' ha' : '–'], [t.ramp, fx.ramp != null ? nf(fx.ramp, 1) + ' km' : '–']]
    .map(([a, b]) => `<tr><td>${a}</td><td class="n">${b}</td></tr>`).join('');
  $('panel').innerHTML = `
    <div><p class="pname">${f.name}</p><p class="pwijk">${f.wijk} · ${f.code}</p></div>
    <div class="kpis">
      <div class="kpi"><b>${nf(f.total)}</b><small>${t.tyr}</small></div>
      <div class="kpi"><b>${pct(f.total / CITY)}</b><small>${t.share}</small></div>
      <div class="kpi"><b style="font-size:16px;display:flex;align-items:center;gap:6px"><i class="sw" style="background:${mainColor(f)}"></i>${t.src[f.main]}</b><small>${t.mainsrc}</small></div>
    </div>
    <div class="stack" aria-hidden="true">${stack}</div>
    <table><tr><th>${t.cols.src}</th><th class="n">${t.cols.val}</th><th class="n">${t.cols.pct}</th><th>${t.cols.basis}</th></tr>${rows}</table>
    ${f.homesElec != null ? `<p class="note">${t.elecNote(nf(f.homesElec))}</p>` : ''}
    <div style="display:flex;flex-direction:column;gap:8px"><h2>${t.why}</h2><ul class="why">${reasons(f).map(x => `<li>${x}</li>`).join('')}</ul></div>
    <div style="display:flex;flex-direction:column;gap:6px"><h2>${t.facts}</h2><table>${facts}</table></div>`;
}

function renderTable() {
  const t = T[lang];
  const keys = ['name', 'total', 'main', 'homes', 'traffic', 'industry', 'services', 'waste'];
  const val = (f, k) => k === 'name' ? f.name : k === 'total' ? f.total : k === 'main' ? t.src[f.main] : f.src[k];
  const list = F.slice().sort((a, b) => { const x = val(a, sortKey), y = val(b, sortKey); return (typeof x === 'string' ? x.localeCompare(y) : x - y) * sortDir; });
  const head = '<tr>' + keys.map((k, i) => `<th class="${i === 0 || i === 2 ? '' : 'n'}"><button type="button" data-k="${k}">${t.tableCols[i]}${sortKey === k ? (sortDir < 0 ? ' ↓' : ' ↑') : ''}</button></th>`).join('') + '</tr>';
  const body = list.map(f => `<tr data-c="${f.code}"><td>${f.name}</td><td class="n"><b>${nf(f.total)}</b></td><td><span style="display:inline-flex;align-items:center;gap:6px"><i class="sw" style="background:${mainColor(f)}"></i>${t.src[f.main]}</span></td>` + ['homes', 'traffic', 'industry', 'services', 'waste'].map(k => `<td class="n">${nf(f.src[k])}</td>`).join('') + '</tr>').join('');
  $('all').innerHTML = head + body;
  $('all').querySelectorAll('th button').forEach(b => b.addEventListener('click', () => { const k = b.dataset.k; if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = k === 'name' || k === 'main' ? 1 : -1; } renderTable(); }));
  $('all').querySelectorAll('tr[data-c]').forEach(tr => tr.addEventListener('click', () => { select(F.find(f => f.code === tr.dataset.c)); window.scrollTo({ top: 0, behavior: 'smooth' }); }));
}

function renderMethods() {
  const t = T[lang];
  $('methods').innerHTML = `<h2>${t.methodsTitle}</h2><ol>${t.methods.map(m => `<li>${m}</li>`).join('')}</ol><p class="note">${t.limits}</p>
    <h2>${t.srcTitle}</h2><ol>${SOURCES.map(([n, u]) => `<li>${n}<br><a class="url" href="${u}" target="_blank" rel="noopener">${u}</a></li>`).join('')}</ol>`;
}

function renderChrome() {
  const t = T[lang];
  $('app').setAttribute('dir', lang === 'fa' ? 'rtl' : 'ltr');
  document.documentElement.lang = lang;
  $('t-title').textContent = t.title; $('t-sub').textContent = t.sub; $('t-pick').textContent = t.pick; $('t-all').textContent = t.all;
  $('l-en').setAttribute('aria-pressed', String(lang === 'en')); $('l-fa').setAttribute('aria-pressed', String(lang === 'fa'));
  const pick = $('pick'); pick.innerHTML = F.map(f => `<option value="${f.code}">${f.name}</option>`).join(''); pick.value = selected.code;
  $('modes').innerHTML = Object.entries(t.modes).map(([k, v]) => `<button class="btn" type="button" data-m="${k}" aria-pressed="${k === mode}">${v}</button>`).join('');
  $('modes').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { mode = b.dataset.m; renderChrome(); paint(); }));
}

function select(f) { selected = f; $('pick').value = f.code; paint(); renderPanel(); }
function renderAll() { renderChrome(); paint(); renderPanel(); renderTable(); renderMethods(); }

$('pick').addEventListener('change', e => select(F.find(f => f.code === e.target.value)));
$('l-en').addEventListener('click', () => { lang = 'en'; try { localStorage.setItem('almelo-lang', 'en'); } catch (e) {} renderAll(); });
$('l-fa').addEventListener('click', () => { lang = 'fa'; try { localStorage.setItem('almelo-lang', 'fa'); } catch (e) {} renderAll(); });
renderAll();
})();
</script>
